spring.application.name=kafka-consumer

server.port= 8081 



spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=notification-group

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.consumerkafka.test.event


spring.kafka.consumer.properties.spring.json.type.mapping=notification:com.consumerkafka.test.event.NotificationEvent